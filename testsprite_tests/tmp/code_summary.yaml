version: "2"
type: frontend
tech_stack:
  - Next.js 15
  - React 19
  - TypeScript
  - Tailwind CSS v4
  - Framer Motion
  - Recharts
  - React Hook Form
  - Zod
routes:
  - path: /
    file: src/app/page.tsx
    auth_required: false
    description: Home page with statistics and summaries
  - path: /about
    file: src/app/about/page.tsx
    auth_required: false
    description: About page with firm methodology and team
  - path: /advisory-services
    file: src/app/advisory-services/page.tsx
    auth_required: false
    description: Detailed advisory services
  - path: /investment-intelligence
    file: src/app/investment-intelligence/page.tsx
    auth_required: false
    description: Investment themes and macro analysis
  - path: /track-record
    file: src/app/track-record/page.tsx
    auth_required: false
    description: Dynamic charts and case studies
  - path: /transactions
    file: src/app/transactions/page.tsx
    auth_required: false
    description: Client-side filtering of real estate evidence table
  - path: /insights
    file: src/app/insights/page.tsx
    auth_required: false
    description: Research publications
  - path: /contact
    file: src/app/contact/page.tsx
    auth_required: false
    description: Contact form
features:
  - name: Navigation
    description: Navigate across all pages using the top menu and mobile hamburger menu
    files:
      - src/components/layout/Navigation.tsx
    entry_route: /
    user_interactions:
      - Click desktop navigation links
      - Open mobile hamburger menu
      - Click mobile navigation links
      - Close mobile menu
    api_calls: []
    auth_required: false
  - name: Contact Form Submission
    description: Submit a contact inquiry via Resend
    files:
      - src/app/contact/page.tsx
      - src/components/patterns/ContactForm.tsx
      - src/lib/email/index.ts
    entry_route: /contact
    user_interactions:
      - Fill first name input field
      - Fill last name input field
      - Fill email input field
      - Fill message textarea
      - Submit form
      - View validation errors on empty submission
      - View success state on valid submission
    api_calls:
      - method: POST
        endpoint: Server Action (submitContactForm)
    auth_required: false
  - name: Filter Transactions
    description: Filter transactions by geography and asset class
    files:
      - src/app/transactions/page.tsx
      - src/components/patterns/TransactionRow.tsx
    entry_route: /transactions
    user_interactions:
      - Select Asset Class filter dropdown
      - Select Geography filter dropdown
      - View filtered results in table
    api_calls: []
    auth_required: false
  - name: Track Record Charts
    description: View dynamic charts in track record page
    files:
      - src/app/track-record/page.tsx
      - src/app/track-record/TrackRecordCharts.tsx
    entry_route: /track-record
    user_interactions:
      - Scroll to render charts
      - Hover over chart tooltips
    api_calls: []
    auth_required: false
known_limitations: []
